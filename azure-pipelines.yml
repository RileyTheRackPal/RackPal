# ======================================================================
# RackPal CI — Azure DevOps, Windows.
# ======================================================================
#
# ----------------------------------------------------------------------
# WHAT IS VERIFIED AND WHAT IS NOT. READ THIS FIRST.
# ----------------------------------------------------------------------
# This file was written on a developer machine and, for three and a half
# weeks, NO AZURE DEVOPS RUN HAD EVER EXECUTED IT. That sentence stood here
# unedited the whole time, which is the only reason the gap was cheap to
# find. IT RAN ON 2026-08-27: pipeline "RackPal CI (Windows)" (definition 1),
# build 20260827.1, against `main` at 46ec050, and it PASSED FIRST TRY --
# all 24 steps, no fixes, 22 minutes wall clock. What that run proved and
# what it still did not are separated below, and neither is dressed up as
# the other.
#
# SELF-HOSTED SINCE 2026-08-30, AND THAT CHANGES ONE OF THE CLAIMS BELOW.
# The `pool:` block moved from `vmImage: 'windows-2022'` to the `Default`
# pool's own agent, on cost rather than on engineering: 34 runs had spent
# 643 of the month's 1,800 free Microsoft-hosted minutes at a mean of 19.4
# each. The full trade is written at that block; the part that belongs in
# THIS section is what stopped being verified.
#
# The clean checkout survives (`workspace: clean: all` plus a `clean: true`
# checkout, both of which work identically on a self-hosted agent) and so
# does the Flutter pin (`ensure_flutter.ps1` installs and verifies the
# pinned SDK, which was never inherited from the image). **What no longer
# holds is "and it builds on a machine that is not the author's".** Every
# run below now happens on the same desk as `run_local.ps1`, so a
# machine-level dependency -- an environment variable, a tool outside the
# pinned Flutter, a path that happens to exist here -- passes CI and is
# found by whoever clones next. Run 1's finding that `windows-2022`
# carries the VS2022 C++ desktop workload is now a fact about one laptop.
#
# VERIFIED — every command below was run on a Windows 11 machine with the
# pinned toolchain (Flutter 3.44.4 stable, Dart 3.12.2), and the gate
# scripts were mutation-tested, meaning each was deliberately broken and
# observed to FAIL before being restored:
#
#   * tools/ci/analyze_gate.ps1 — read 0 errors / 0 warnings / 195 infos and
#     exited 0 when this was written. Planting one long line in apps/rackpal
#     made it read 196 and exit 1; planting an unused local made it read a
#     warning and exit 1; planting a type error made it read 2 errors and
#     exit 1. Its `dart analyze --format=machine` output was also compared
#     issue by issue against `flutter analyze` — 195 apiece, symmetric
#     difference empty — so the gate and the command a developer types by
#     hand agree. THE COUNT HAS SINCE MOVED, twice and downward: to 194, then
#     to 173 when the tree was formatted on 2026-08-03 and 21 long-line infos
#     stopped existing. The pin lives in tools/ci/analyze_info_baseline.txt,
#     which is the number to trust; 195 is left here because it is what the
#     mutation test was run against and rewriting it would falsify the
#     evidence rather than update it.
#   * `dart format --output=none --set-exit-if-changed .` — GATE 1b, added
#     2026-08-03, and mutation-tested to the same standard as the rest.
#     Observed to exit 1 against the unformatted tree, naming 124 of 426
#     files, and 0 immediately after the sweep. Then, wired into
#     run_local.ps1, a planted `return   DeviceKind.rackDevice ;` in
#     catalog_placement.dart made it read FAIL (1) while the other eight fast
#     gates stayed green, and green again on restore. The gate and its own
#     remedy are the same command, which is the property no other gate here
#     has.
#   * tools/ci/run_suite.ps1 + tools/ci/junit_from_dart_test.py — run
#     end to end against `dart test` and `flutter test`, with a real
#     assertion failure, a real SKIP, and a real COMPILE failure, each of
#     which produced a non-zero exit and a well-formed JUnit document
#     carrying the diagnostic. The converter's case counts reproduce this
#     repository's own published totals exactly for three of the five suites
#     (rackpal_export 183, rackpal_text 1, apps/rackpal 664), which is
#     what makes the non-vacuity floors below trustworthy numbers.
#   * The non-vacuity floor — a floor of 500 over a genuinely-passing
#     183-test suite failed with exit 1, so "everything passed" cannot by
#     itself satisfy it. AND it counts NON-SKIPPED cases only: measured
#     against a 3-test package with `skip:` on every test, the floor now
#     fails where it previously passed, so silencing a flaky batch cannot
#     buy a green run.
#   * tools/ci/verify_tracked_sources.ps1 — exits 1 naming the two lib/
#     sources of this changeset that git did not yet know about, and 0 once
#     a lib/ tree is fully tracked. It is the local half of "would a clone
#     of this commit even compile".
#   * tools/ci/junit_converter_selftest.py — 13 mutants of the converter,
#     13 caught, 0 survivors.
#   * tools/ci/ensure_flutter.ps1 -VerifyOnly — passes against the real
#     3.44.4 toolchain and exits 1 when told to require 3.45.0.
#   * tools/ci/verify_windows_build.ps1 — passes against a real Release
#     build; fails when a dartjni.dll is planted, when a plugin DLL is
#     removed, when a packaged starter is CRLF-corrupted, and when the exe
#     is missing.
#   * python tools/pal1_check.py, tools/palette_parity.py and
#     tools/registry_parity.py — exit 0.
#   * All five suites and `flutter build windows --release` — green.
#
# SETTLED BY RUN 1 (build 20260827.1). Each of these was a named unknown in
# the list this replaces, and each is now a measurement:
#
#   * THE YAML SCHEMA. Accepted by the service unmodified. Zero task-name or
#     input typos, against an expectation in this very file that there would
#     be some.
#   * THE FLUTTER SDK DOWNLOAD. The archive URL resolved. It was also
#     HEAD-checked from the author's machine before the run (HTTP 200,
#     1,899,506,906 bytes, Last-Modified 2026-06-24, which matches the
#     framework date the pin names), so the download had two independent
#     confirmations rather than one.
#   * THE HOSTED IMAGE BUILDS DESKTOP WINDOWS. `windows-2022` still carries
#     the VS2022 C++ desktop workload; "Build Windows release" took 100
#     seconds and "Gate: Windows release output" passed over what it made.
#   * WALL-CLOCK TIME, now measured rather than estimated: 22m01s total, of
#     which rackpal_ui is 8m29s and the SDK install 1m44s on a COLD cache.
#     The 120-minute timeout below is left alone deliberately: one sample is
#     not a distribution, and a cache miss plus a slow agent is the case the
#     headroom is for.
#   * NON-VACUITY, which is the number that matters most here. 5,609 cases,
#     0 failed, 0 errored, 0 SKIPPED, and every one of the five suites
#     reported "exactly at it" against its floor. Zero slack means a deleted
#     test fails the gate on the next run rather than in 3,247 tests' time,
#     which is the state #764 had to go looking for.
#   * THE ANALYZER RATCHET: 0 errors, 0 warnings, 173 infos, exactly the pin
#     in tools/ci/analyze_info_baseline.txt.
#
# SETTLED BY RUN 3 (build 20260828.1), which nobody had to manufacture:
#
#   * PR VALIDATION END TO END. The branch policy ("Build validation" on
#     `main`, blocking, policy id 1) fired on PR !1, built
#     `refs/pull/1/merge` -- the MERGE COMMIT, not either branch, which is
#     the property that makes it worth having -- passed all 24 steps in
#     18m16s, and the policy evaluation returned `approved`. A configured
#     policy had been distinguished from an exercised one in this list on
#     purpose; it is now exercised.
#     THE `pr:` BLOCK BELOW IS STILL IGNORED by the service and had nothing
#     to do with any of that.
#     A DIRECT PUSH TO `main` IS REFUSED OUTRIGHT, which two earlier
#     versions of this header got wrong. They said the policy "gates PR
#     COMPLETION only" and that "a direct push to `main` still lands".
#     Neither is true: in Azure Repos a BLOCKING policy protects the branch
#     itself, and the push is rejected with
#       TF402455: Pushes to this branch are not permitted; you must use a
#       pull request
#     There is exactly one policy on this repository and it does both jobs.
#     So `trigger:` is not a safety net behind a hole in the gate; there is
#     no hole. Everything lands through a PR, and budget the policy build
#     (~18 min) before one can complete.
#
# STILL NOT VERIFIED. ONE ITEM REMAINS, AND IT IS THE IMPORTANT ONE:
#   * A RED RUN ON THE SERVICE. Every gate script was mutation-tested
#     locally, but no Azure DevOps run has ever FAILED, so the service-side
#     reporting path (Tests tab, failed-step surfacing) is unexercised in
#     the failure direction. Green over a broken reporter looks identical to
#     green over a healthy one from here.
#     FOUR GREEN RUNS DO NOT SHORTEN THIS LIST. They are four samples of
#     the same path. The number that would settle it is one, and it has to
#     be red.
#
# SETTLED BY RUN 2 (build 20260827.2, branch `ci-pipeline`), which existed
# to take the branches run 1 could not:
#
#   * THE WARM CACHE PATH. Both Cache@2 restores HIT. "Install and VERIFY
#     Flutter" fell from 104s to 7s against a 68s restore, and the whole job
#     came in at 18m28s against run 1's 22m01s. The verification still ran
#     on the restored SDK rather than being skipped, which is the property
#     that makes caching an SDK safe here at all.
#   * A NON-`main` BRANCH. The definition runs against an arbitrary branch,
#     which is what makes the branch policy above able to work at all.
#
# ----------------------------------------------------------------------
# GOLDENS ARE NOT IN THIS PIPELINE, AND THAT IS DELIBERATE.
# ----------------------------------------------------------------------
# The roadmap's per-milestone rule is "CI passes, goldens pass, the app
# opens the four starter projects". This pipeline satisfies the FIRST limb
# and no more, and it must not be read as satisfying the others.
#
#   * GOLDENS: there are zero. No `matchesGoldenFile`, no `goldens/`
#     directory, no `@Tags(['golden'])`, and no `flutter_test_config.dart`
#     for docs/11 section 3.1's FontLoader registration to live in
#     (docs/12 section 4.3). Standing them up is a real piece of work —
#     choosing the display-list-versus-pixel split, pinning the font
#     environment, and generating a first corpus that somebody has actually
#     read — and doing it inside a CI task would produce a corpus blessed by
#     nobody, which is worse than none. IT IS ITS OWN TASK. There is
#     deliberately no `--tags golden` step here, and deliberately no
#     `--exclude-tags golden` either: the first golden somebody writes will
#     run in the ordinary suites below rather than being silently skipped.
#   * "THE APP OPENS THE FOUR STARTER PROJECTS": not runnable headless
#     without an `integration_test` target this repository does not have.
#     What IS checked is one step short of it and is labelled as such —
#     tools/ci/verify_windows_build.ps1 asserts the four starters were
#     PACKAGED into the shipped bundle and are byte-intact there.
#
# ----------------------------------------------------------------------
# WHY WINDOWS, AND ONLY WINDOWS
# ----------------------------------------------------------------------
# `flutter build windows` is required, and several suites are Windows-
# specific: the first-party IFileDialog channel in apps/rackpal/windows/
# runner/, apps/rackpal/test/session/registry_claim_test.dart, and MAX_PATH
# handling in the storage layer. docs/11 section 7 sketches a three-OS
# matrix; that is a later question, and a green Linux job would not tell us
# anything about the product, which ships as a Windows desktop application.
#
# ----------------------------------------------------------------------
# A CLEAN CHECKOUT IS ITSELF A GATE
# ----------------------------------------------------------------------
# During the persistence stage `*.rackpal` matched no `.gitattributes`
# rule, so a fresh clone on Windows would have checked the byte-exact
# starter assets out as CRLF and failed CR-117 — a defect invisible on a
# working tree that already had them right. `workspace: clean: all` plus
# `checkout: clean: true` is what makes this pipeline test the CLONE and not
# a leftover directory, and the "Checkout forensics" step records the
# `core.autocrlf` the agent actually used, so the answer is in the log
# rather than assumed.
#
# THE SAME CLASS BIT AGAIN, DIFFERENTLY, WHILE THIS FILE WAS BEING WRITTEN.
# `packages/rackpal_core/lib/rackpal_core.dart` was committed carrying
# `export 'src/commands/rack_commands.dart';` while that file was never
# added to the index. Locally everything stayed green — the file is on the
# disk, so the analyzer resolved it and all five suites passed — and a clone
# of that commit gets an `export` of a URI that does not exist, which is an
# analyzer ERROR and a compile failure in every package importing the
# barrel. THAT is the failure this job's clean clone catches on run 1, and
# it is why `tools/ci/verify_tracked_sources.ps1` now asks git the cheap
# half of the question before a commit is made. Nothing in this job needs
# that script (a clone has no untracked files by construction); it exists so
# the answer arrives before the push rather than after it.
# ======================================================================

trigger:
  branches:
    include:
      - main

# IGNORED for Azure Repos Git — kept because it documents the intent and
# becomes live if this repository is ever mirrored to GitHub. Real PR
# validation is a branch policy, and that policy NOW EXISTS: "Build
# validation" on `main`, blocking, pointing at definition 1, created
# 2026-08-27. THE TWO ARE NOT THE SAME MECHANISM and editing this block
# will not change PR behaviour by one bit. See the header.
pr:
  branches:
    include:
      - main

variables:
  # ==================================================================
  # THE FLUTTER PIN. ONE PLACE. docs/03-architecture.md section 10.2.
  # ==================================================================
  # This resolves that section's standing VERIFY item. The corpus named two
  # stable versions — design-architecture.md targets 3.44.4, the canvas
  # research reported 3.41 — and the pin is load-bearing because a minor
  # bump routinely shifts antialiasing by a pixel, so golden regeneration
  # must be a deliberate, reviewed step of every upgrade. The local
  # toolchain is 3.44.4 and design-architecture.md targets 3.44.4, so
  # 3.44.4 is the resolution.
  #
  # CHANGING THIS NUMBER IS A REVIEWED ACT. When goldens exist, the same
  # commit regenerates them and the diff gets read (docs/11 section 9,
  # item 9).
  flutterVersion: '3.44.4'
  # The framework revision 3.44.4 resolved to on the machine this pipeline
  # was written on. WARNED ABOUT, NOT ENFORCED, because there are no
  # goldens for it to protect yet — see tools/ci/ensure_flutter.ps1, which
  # says where to promote it to a hard failure.
  flutterFrameworkRevision: 'ad70ec4617166f1c38e5d2bfd388af71fda14f06'

  # Test streams and JUnit reports. Under build/ because that directory is
  # gitignored AND is skipped by the repo sweep in
  # apps/rackpal/test/gitattributes_byte_exactness_test.dart — writing CI
  # output anywhere else makes that test report files no clone ever sees.
  ciOutDir: '$(Build.SourcesDirectory)/build/ci'

  # A known, cacheable location for the pub cache.
  PUB_CACHE: '$(Pipeline.Workspace)/.pub-cache'

jobs:
  - job: windows_ci
    displayName: 'Analyze, test, build (Windows)'
    # An estimate. The five suites plus a cold Windows build have never been
    # timed on a hosted agent; raise it if run 1 is cut off rather than
    # assuming a hang.
    timeoutInMinutes: 120

    pool:
      # SELF-HOSTED SINCE 2026-08-30, and the reason is money rather than
      # engineering: 34 runs had consumed 643 of the 1,800 free Microsoft-
      # hosted minutes this month at a mean of 19.4 minutes each, and M4
      # still owes two stories, a drill and their pull requests.
      #
      # This was `vmImage: 'windows-2022'`, named explicitly rather than
      # `windows-latest` so a moving image alias could not re-point itself
      # at a new Windows and a new Visual Studio without anybody deciding
      # to. That argument still holds and is now MOOT: a self-hosted agent
      # has no image to move.
      #
      # ── WHAT SURVIVES THE MOVE, MEASURED RATHER THAN ASSUMED ─────────
      #
      #   * THE CLEAN CHECKOUT. `workspace: clean: all` below deletes the
      #     entire working directory before the job, and `checkout: self`
      #     re-clones with `clean: true`. Both work identically on a
      #     self-hosted agent, so "would a clean clone build" is still
      #     answered here and nowhere else. That is the gate `run_local.ps1`
      #     prints a NOTE about being unable to give.
      #   * THE FLUTTER PIN. `ensure_flutter.ps1 -Version -Expected
      #     FrameworkRevision` installs the pinned SDK into the agent's
      #     tools directory and verifies the framework revision. The
      #     toolchain was never inherited from the image, so nothing about
      #     it changes.
      #   * EVERY GATE. The step list below is untouched.
      #
      # ── WHAT IS GIVEN UP, STATED PLAINLY ────────────────────────────
      #
      # **CI NOW RUNS ON THE SAME MACHINE AS `run_local.ps1`.** It can no
      # longer catch a MACHINE-level dependency: an environment variable,
      # a tool installed outside the pinned Flutter, a path that happens to
      # exist here. A hosted agent proved "this builds somewhere that is
      # not the author's desk"; this one cannot, and the next person to
      # clone onto a fresh machine is the one who finds out.
      #
      # That is a real loss and it is not being dressed up. It is accepted
      # because the alternative was running out of minutes mid-milestone,
      # and because the Windows build gate is the only step that leans on
      # anything the image supplied (the VS C++ toolchain).
      #
      # ── OPERATIONAL ─────────────────────────────────────────────────
      #
      # The agent is `{agent-host}` in the `Default` pool. **The pool is
      # `Default`, not `LocalMachine`**: pool 11 carries that name and has
      # zero agents registered, which is worth knowing before anybody
      # re-points this line at it. A build queues silently until the agent
      # comes online, so an unexplained "queued" here is usually a stopped
      # agent rather than a busy one -- it runs INTERACTIVELY from
      # `run.cmd` and is not a Windows service.
      #
      # ── HOW LONG IT ACTUALLY TAKES ─────────────────────────────────
      # THIS NOTE WAS WRONG TWICE, IN OPPOSITE DIRECTIONS, and both times
      # from one sample: first "25.6 minutes, about 35% slower" off the
      # cold-cache first run, then nearly "comfortably faster" off two warm
      # PR builds. Measured 2026-08-31 over all 38 completed runs:
      #
      #   hosted       n=33   mean 19.4   median 19.0   18.0 to 22.0
      #   self-hosted  n=5    mean 20.8   median 25.2   10.9 to 30.4
      #
      # The means are close and THE VARIANCE IS THE STORY: 4.0 minutes of
      # spread against 19.5, nearly five times as wide, on five runs.
      #
      # The five split by trigger, which is a CORRELATION and not a cause:
      # `refs/pull/*/merge` took 10.9 and 11.8, `refs/heads/*` took 25.6,
      # 30.4 and 25.2. The obvious mechanism is the one named below -- it
      # shares the machine -- because a branch build starts the instant
      # somebody pushes, which is when that person carries on working and
      # starts a local gate run, while a policy build is waited on. To test
      # it, run one branch build with the machine idle.
      #
      # PROVEN, not assumed: build 20260830.17 ran on it against 3cec172 and
      # passed every gate.
      # The build's own `queue` field still reads "Azure Pipelines", which is
      # where the build was SUBMITTED and not where the job ran; the agent's
      # assigned request is what actually answers that, and it named this
      # job.
      name: 'Default'

    workspace:
      # Delete the entire working directory before the job. THIS IS A GATE,
      # not tidiness — see the header.
      clean: all

    steps:
      - checkout: self
        displayName: 'Checkout (clean clone)'
        clean: true
        fetchDepth: 1
        fetchTags: false
        persistCredentials: false

      - pwsh: |
          # NOTE ON SYNTAX: no `$(...)` subexpressions in this file's inline
          # scripts. `$(foo)` is Azure Pipelines' own macro syntax and is
          # substituted before PowerShell ever sees the line, so a PowerShell
          # subexpression here is a collision waiting to confuse somebody.
          Write-Host '== checkout forensics =='
          $autocrlf = git config --get core.autocrlf
          $eol = git config --get core.eol
          $commit = git rev-parse HEAD
          Write-Host "core.autocrlf : $autocrlf"
          Write-Host "core.eol      : $eol"
          Write-Host "commit        : $commit"
          Write-Host ''
          # The gate scripts assume `python` (3.7+, standard library only --
          # tools/pal1_check.py already assumes it) and `pwsh` are on PATH on
          # the hosted image. Recorded rather than pinned with
          # UsePythonVersion, which would add a task that can fail for its own
          # reasons; if either line below is empty, that is the explanation
          # for whatever failed three steps later.
          $pythonVersion = & python --version 2>&1
          $pwshVersion = $PSVersionTable.PSVersion.ToString()
          Write-Host "python        : $pythonVersion"
          Write-Host "pwsh          : $pwshVersion"
          Write-Host ''
          Write-Host '-- how git resolved the byte-exact goldens --'
          git check-attr text eol -- apps/rackpal/assets/starters/apartment.rackpal
          git check-attr text eol -- packages/rackpal_core/test/fixtures/a_empty_project.rackpal.json
          # Created here so the artifact-publish steps at the end always have
          # a directory to point at, even when the run died before any suite
          # wrote into it.
          New-Item -ItemType Directory -Path '$(ciOutDir)' -Force | Out-Null
        displayName: 'Checkout forensics'
        # RECORDING, NOT GATING. The assertion lives in
        # apps/rackpal/test/gitattributes_byte_exactness_test.dart, which
        # runs in the apps/rackpal suite below and cross-checks its own
        # reader against real `git check-attr`. This step exists so that when
        # that test fails, the log already says what the agent's git was
        # configured to do.
        continueOnError: true

      # ═══════════════════════════════════════════════════════════════════
      # IS THE PINNED SDK ALREADY ON THIS AGENT? MEASURE, THEN DECIDE
      # ═══════════════════════════════════════════════════════════════════
      # `Agent.ToolsDirectory` is OUTSIDE the workspace, so the clean
      # checkout never touches it and a self-hosted agent still holds the
      # SDK the previous build used. Measured on `{agent-host}`: **3.1
      # GB**, and `Cache@2` was pulling an identical 3.1 GB archive across
      # the network and unpacking it on top of that, every single run.
      #
      # IT WAS THE MOST VARIABLE STEP IN THE JOB BY A WIDE MARGIN, and the
      # restore is the whole of it. Measured over builds 39 to 44:
      #
      #   restore   135s  155s  169s  452s  927s  1019s
      #   verify      8s    6s    6s    6s    6s     6s
      #
      # The SDK is never downloaded: `ensure_flutter.ps1` finds what it
      # needs and measures it in seconds. That 7.5x spread on the restore
      # is most of the difference between a ten-minute build and a
      # twenty-five-minute one, and it bought nothing.
      #
      # THE VERSION IS COMPARED, NOT JUST THE PATH. A directory that
      # exists is not a pin; `flutter.version.json` carries the version
      # AND the framework revision, which are the two things
      # `ensure_flutter.ps1` gates on, so a stale or half-written SDK
      # falls through to the cache exactly as before. A file read rather
      # than `flutter --version`, because spawning the tool to ask whether
      # the tool is there costs more than the check saves.
      #
      # NO POWERSHELL `$( )` SUBEXPRESSIONS BELOW, DELIBERATELY. Azure
      # expands its own `$(name)` macros in this script BEFORE PowerShell
      # ever sees the text, so `$($v.flutterVersion)` is a macro lookup
      # that happens to miss and get left as literal text. It works until
      # it does not, and this file already carries one comment about a
      # trailing space turning a backtick continuation into a syntax
      # error. Plain `$var` interpolation cannot be confused for a macro.
      # The three `$(...)` that remain are macros and are meant to be.
      - pwsh: |
          $marker = Join-Path '$(Agent.ToolsDirectory)' 'flutter/bin/cache/flutter.version.json'
          $present = 'false'
          if (Test-Path $marker) {
            try {
              $v = Get-Content $marker -Raw | ConvertFrom-Json
              $onDisk = $v.flutterVersion
              $onDiskRev = $v.frameworkRevision
              Write-Host "  on disk  : $onDisk @ $onDiskRev"
              if (($onDisk -eq '$(flutterVersion)') -and ($onDiskRev -eq '$(flutterFrameworkRevision)')) {
                $present = 'true'
              }
            } catch {
              Write-Host '  marker unreadable, treating as absent'
            }
          } else {
            Write-Host "  no marker at $marker"
          }
          Write-Host "  required : $(flutterVersion) @ $(flutterFrameworkRevision)"
          Write-Host "  pin already on this agent: $present"
          Write-Host "##vso[task.setvariable variable=FLUTTER_PRESENT]$present"
        displayName: 'Probe: is the pinned Flutter already on this agent?'
        # RECORDING, NOT GATING. If this step fails outright the variable is
        # unset, the cache restores as it always did, and nothing is worse
        # than before.
        continueOnError: true

      - task: Cache@2
        displayName: 'Restore Flutter SDK cache'
        # SKIPPED WHEN THE AGENT ALREADY HAS THE PIN. Kept rather than
        # deleted because it is still correct on a machine that does not:
        # a hosted agent, a rebuilt self-hosted one, or a tool directory
        # somebody has cleared. See the probe above.
        #
        # THE ACCEPTED COST, STATED RATHER THAN DISCOVERED: a skipped task
        # saves no cache either, and Azure evicts an entry that goes
        # unaccessed. So the stored SDK will lapse, and the first build on
        # a machine without the pin downloads from source through
        # `ensure_flutter.ps1` instead of restoring. That is the path the
        # script exists for, it is gated by the same version measurement,
        # and it is a one-off minutes-long cost on a machine that is
        # already being set up, weighed against up to 17 minutes on every
        # build here.
        #
        # The pub cache below is NOT given this treatment and must not be:
        # measured at 2 seconds a run, hitting every time.
        condition: ne(variables['FLUTTER_PRESENT'], 'true')
        inputs:
          # Keyed on the exact version: a different pin is a different cache,
          # never a stale one silently reused.
          key: 'flutter | "$(Agent.OS)" | "$(flutterVersion)"'
          path: '$(Agent.ToolsDirectory)/flutter'
          cacheHitVar: FLUTTER_CACHE_RESTORED
        # An optimisation only. A miss re-downloads; a CORRUPT restore is
        # caught by the version measurement in the next step, which is why
        # caching an SDK is safe here at all.
        continueOnError: true

      # ONE LINE ON PURPOSE. A PowerShell backtick continuation needs the
      # backtick to be the last character on the line, and a YAML block
      # scalar preserves trailing whitespace — so an invisible space added by
      # an editor turns a continuation into a syntax error. Long beats
      # fragile.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/ensure_flutter.ps1 -Version '$(flutterVersion)' -ExpectedFrameworkRevision '$(flutterFrameworkRevision)' -InstallRoot '$(Agent.ToolsDirectory)'
          exit $LASTEXITCODE
        displayName: 'Install and VERIFY Flutter $(flutterVersion)'

      - task: Cache@2
        displayName: 'Restore pub cache'
        inputs:
          # Keyed on the COMMITTED pubspec.lock (DR-248 section 11.247.5).
          # Until 2026-10-11 the lockfile was gitignored, so CI resolved the
          # graph fresh on every run and this key could only approximate it
          # with the pubspecs; a transitive dependency could move under a
          # build nobody changed. The lockfile is now the graph the local
          # gates ran, so it is the key.
          key: 'pub | "$(Agent.OS)" | "$(flutterVersion)" | pubspec.lock'
          path: '$(PUB_CACHE)'
        continueOnError: true

      - pwsh: |
          # The workspace root resolves every member (pubspec.yaml
          # `workspace:`). `flutter pub get`, not `dart pub get`: two members
          # depend on the Flutter SDK.
          #
          # --enforce-lockfile: build EXACTLY the committed graph, and verify
          # every package archive against the lock's sha256 (DR-248 section
          # 11.247.5). A pubspec changed without its lock, or a re-published
          # archive under an old version number, fails here instead of
          # building something nobody gated. It is CI-only on purpose: under
          # Flutter a FAILED enforce run still rewrites pubspec.lock in place,
          # harmless on a throwaway checkout and a trap in a working tree.
          flutter pub get --enforce-lockfile
          exit $LASTEXITCODE
        displayName: 'flutter pub get (workspace root)'

      # ==================================================================
      # GATE 1 — THE ANALYZER
      # ==================================================================
      # Zero errors, zero warnings, and a RATCHETED info count pinned in
      # tools/ci/analyze_info_baseline.txt. The full argument for a ratchet
      # rather than `--fatal-infos` is in the header of
      # tools/ci/analyze_gate.ps1 and in the baseline file; the short version
      # is that --fatal-infos would make main permanently red today (195
      # infos) and an unbounded count is how 203 became 395 during the
      # salvage.
      #
      # `dart format --set-exit-if-changed` is GATE 1b below, as of
      # 2026-08-03. It was deliberately absent until then: docs/12 section 4.1
      # recorded the choice as the user's, and standing up CI should not
      # pre-empt it. The answer was adopt the formatter AND keep this ratchet,
      # so the two live side by side rather than one replacing the other.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/analyze_gate.ps1
          exit $LASTEXITCODE
        displayName: 'Gate: analyzer (0 errors, 0 warnings, ratcheted infos)'
        condition: succeededOrFailed()

      # ==================================================================
      # GATE 1b — THE FORMATTER
      # ==================================================================
      # DR-017 (canon section 11.16), answering docs/12 section 4.1. The tree was
      # formatted in one mechanical commit (b6ff394, 124 of 426 files) and
      # this keeps it that way. It is a gate rather than an advisory step on
      # purpose: a permanently-yellow step trains people to ignore output,
      # which is the exact argument docs/11 section 8 makes for strictness.
      #
      # The count in the decision aged badly while the question sat open --
      # docs/12 section 4.1 and this file's own earlier comment both say 88
      # files, and it was 124 by the time it was paid. That is the argument
      # for gating a mechanical thing immediately rather than scheduling it.
      - pwsh: |
          dart format --output=none --set-exit-if-changed .
          exit $LASTEXITCODE
        displayName: 'Gate: dart format'
        condition: succeededOrFailed()

      # ==================================================================
      # GATE 2 — THE PALETTE
      # ==================================================================
      # docs/11 section 7 marks pal1_check BLOCKING: exit 1 means a palette
      # collision ships. PAL-1 was asserted "verified clear" three times
      # against a palette holding fourteen collisions, each time by reading a
      # table instead of enumerating the 385 in-band pairs. palette_parity
      # is the second half — it proves the DOCUMENTS still agree with the
      # registry — and its own docstring asks for both to run in CI.
      #
      # This block used to say it "needs no Dart and no dependencies". Since
      # SFE-A2 (DR-122 section 11.121.4) pal1_check sends its table to
      # rackpal_core's tool/pal1_verdicts.dart, so it NEEDS the workspace's
      # `flutter pub get` above it, which is where it already sat.
      - pwsh: |
          python tools/pal1_check.py
          exit $LASTEXITCODE
        displayName: 'Gate: PAL-1 palette conformance'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/palette_parity.py
          exit $LASTEXITCODE
        displayName: 'Gate: palette docs/registry parity'
        condition: succeededOrFailed()

      # The third half, added by DR-010 section 11.10.1. The registries now
      # ship as a SEEDED DART CATALOG rather than the assets/catalog/
      # registries.json that never existed, so the 8 hues and 55 dash/weight
      # pairs live in Dart as well -- a fourth copy of the data that bit this
      # project four times already. palette_parity proves the docs agree with
      # the authority; this proves the code does. Still no Dart and no
      # dependencies: it parses the seed source rather than running it.
      # Since DR-175 it also holds each family's name, connector, tag,
      # direction and topology to the table in seed-devices.md section 4.4.
      - pwsh: |
          python tools/registry_parity.py
          exit $LASTEXITCODE
        displayName: 'Gate: palette code/registry parity'
        condition: succeededOrFailed()

      # The fourth gate that reads the corpus (#780, DR-095 section 11.94.9):
      # roadmap section 8.9 as a check. No milestone before the current one
      # may hold an exit clause that is neither DEMONSTRATED/CONFIRMED nor
      # parked on a named later milestone by a ruling. No Dart and no
      # dependencies; it reads docs/12's clause tables and runs its own
      # planted cases first, so a green run is evidence that it can fail.
      - pwsh: |
          python tools/milestone_gate.py
          exit $LASTEXITCODE
        displayName: 'Gate: milestone completeness (section 8.9)'
        condition: succeededOrFailed()

      # #972: the rule-review pack's generator stopped running at DR-132
      # and nothing failed for three rulings. Parses the catalogue and the
      # pack's grouping, writes nothing; a rule with no place in the pack,
      # or in the wrong band, fails here.
      - pwsh: |
          python tools/rule_review.py --check
          exit $LASTEXITCODE
        displayName: 'Gate: rule review pack grouping (#972)'
        condition: succeededOrFailed()

      # ==================================================================
      # GATE 3 — THE REPORTING PATH ITSELF
      # ==================================================================
      # Before trusting anything the Tests tab says, prove the converter that
      # fills it cannot report green over a red run. Runs before the suites
      # so that a broken converter is a clearly-labelled failure rather than
      # a suspiciously empty results page.
      - pwsh: |
          python tools/ci/junit_converter_selftest.py
          exit $LASTEXITCODE
        displayName: 'Gate: JUnit converter self-test'
        condition: succeededOrFailed()

      # ==================================================================
      # THE FIVE SUITES
      # ==================================================================
      # EVERY suite, named one at a time. `dart test` at the workspace root
      # would run nothing — the root package holds fixtures and no tests —
      # so a single command here is not "all of them", it is silently none of
      # them. Each step runs even if an earlier one failed
      # (`succeededOrFailed`), because one red suite should not hide the
      # state of the other four; the job still goes red.
      #
      # EACH SUITE ALSO HAS A NON-VACUITY FLOOR. A runner that discovers no
      # tests exits 0 and prints a cheerful summary, so "all tests passed" is
      # not by itself evidence that any ran. run_suite.ps1 counts the cases
      # in the JUnit document — EXCLUDING skipped ones — and fails below the
      # floor recorded for that suite name in `$SuiteFloors` in
      # tools/ci/run_suite.ps1 — ONE place, so this file and
      # tools/ci/run_local.ps1 cannot drift apart on the numbers. Floors as
      # measured on the tree this file ships with: rackpal_core 976,
      # rackpal_ui 382, apps/rackpal 664, rackpal_export 183,
      # rackpal_text 1 = 2206. THE NUMBERS ARE NOT COPIED HERE TO BE
      # AUTHORITATIVE — the script is — and they are restated only so a
      # reader of this file knows the order of magnitude. Going ABOVE a
      # floor is logged and nothing more; tests going up is the point, and a
      # gate that nags on every good day is ignored on the bad one.
      # UNTIMED (DR-178, #843): the tests tagged `perf` assert a stopwatch
      # reading and run in their own step after apps/rackpal, below.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_core -Runner dart -Name rackpal_core -Tests untimed -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_core (pure Dart, untimed)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_text -Runner dart -Name rackpal_text -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_text (pure Dart)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_export -Runner dart -Name rackpal_export -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_export (pure Dart)'
        condition: succeededOrFailed()

      # THE ONLY SUITE THAT NEEDS A FILE THE AGENT DID NOT BUILD. pdfium is
      # vendored into the repository (CR-100, DR-153 §11.152.3), so a clean
      # checkout has it and nothing is fetched here; if it is ever missing,
      # the failure names the vendoring command rather than crashing.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_pdfium -Runner dart -Name rackpal_pdfium -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_pdfium (pure Dart, vendored native)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_ui -Runner flutter -Name rackpal_ui -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_ui (Flutter)'
        condition: succeededOrFailed()

      # Carries the load-bearing source gates: the byte-exactness /
      # .gitattributes gate, the bounded registry claim, session layering
      # RULE 15, baseline parity (CR-081/CR-086), the starter byte-exactness
      # assertions and the no-print gate.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package apps/rackpal -Runner flutter -Name rackpal_app -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: apps/rackpal (Flutter)'
        condition: succeededOrFailed()

      # DR-178 (#843). THE TESTS THAT ASSERT A STOPWATCH READING, ALONE. The
      # core suite above runs with `-Tests untimed`; this runs only the tests
      # tagged `perf`, one at a time, after every other suite has finished,
      # so a one-frame budget does not share the agent with the rest of its
      # own suite. On 2026-09-05 that sharing read 20.877 ms against 6.355 ms
      # alone and failed a docs-only commit. It blocks exactly as a suite
      # does and has its own floor in `$SuiteFloors`.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_core -Runner dart -Name rackpal_core_timed -Tests timed -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_core timed budgets (one at a time)'
        condition: succeededOrFailed()

      # ==================================================================
      # REPORTING
      # ==================================================================
      - task: PublishTestResults@2
        displayName: 'Publish test results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/*.junit.xml'
          searchFolder: '$(ciOutDir)'
          mergeTestResults: true
          testRunTitle: 'RackPal — Windows — Flutter $(flutterVersion)'
          # A SECOND, INDEPENDENT VERDICT. The suite steps above already
          # failed the job on a non-zero runner exit; this fails it again if
          # the published XML contains a failure the step somehow did not.
          # The two disagreeing is itself information.
          failTaskOnFailedTests: true
          # If a suite crashed before writing anything, the absent file is a
          # finding, not a shrug.
          failTaskOnMissingResultsFile: true

      - task: PublishPipelineArtifact@1
        displayName: 'Publish raw test streams (forensics)'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(ciOutDir)'
          artifact: 'test-streams'
          publishLocation: 'pipeline'

      # ==================================================================
      # THE WINDOWS RELEASE BUILD
      # ==================================================================
      # Runs even when a suite failed: whether the application still builds
      # is independent information, and the artifact is what a reviewer wants
      # in hand while reading the failure.
      - pwsh: |
          flutter build windows --release
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            # Consumed by the three steps below. WITHOUT IT they would run
            # against a directory that does not exist and file a second,
            # misleading failure ("no Release directory") on top of the real
            # one, which is how a log stops being read.
            Write-Host '##vso[task.setvariable variable=windowsBuildProduced]true'
          }
          exit $code
        displayName: 'Build Windows release'
        workingDirectory: 'apps/rackpal'
        condition: succeededOrFailed()

      # Asserts things about what the build ACTUALLY PRODUCED, which nothing
      # in this repository has ever looked at —
      # apps/rackpal/test/flutter_dependency_test.dart reads the dependency
      # graph, the inputs. dartjni.dll shipped for weeks in the gap between
      # the two.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/verify_windows_build.ps1
          exit $LASTEXITCODE
        displayName: 'Gate: Windows release output'
        condition: and(succeededOrFailed(), eq(variables['windowsBuildProduced'], 'true'))

      - task: ArchiveFiles@2
        displayName: 'Archive Windows release'
        condition: and(succeededOrFailed(), eq(variables['windowsBuildProduced'], 'true'))
        inputs:
          # Absolute: task inputs are not all resolved against the same
          # relative root, and this one is worth not guessing about.
          rootFolderOrFile: '$(Build.SourcesDirectory)/apps/rackpal/build/windows/x64/runner/Release'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Build.ArtifactStagingDirectory)/rackpal-windows-x64-$(Build.BuildNumber).zip'
          replaceExistingArchive: true

      # THE FIRST STEP TOWARD THE M2 PORTABLE BUILD (task #5). This is a ZIP
      # of the Release directory and nothing more: no installer, no signing,
      # no portable-mode data root. It is a build artifact a human can
      # download, not a release.
      - task: PublishPipelineArtifact@1
        displayName: 'Publish Windows release artifact'
        condition: and(succeededOrFailed(), eq(variables['windowsBuildProduced'], 'true'))
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/rackpal-windows-x64-$(Build.BuildNumber).zip'
          artifact: 'rackpal-windows-x64'
          publishLocation: 'pipeline'

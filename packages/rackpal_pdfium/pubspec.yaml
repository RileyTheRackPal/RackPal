name: rackpal_pdfium
description: >
  RackPal's binding over the vendored pdfium (DR-153 §11.152.4). Pure Dart
  and dart:ffi: no Flutter, and nothing depends on it except apps/rackpal,
  so rackpal_core keeps zero native dependencies and its suite runs on a
  machine with a Dart SDK and nothing else.
publish_to: none
version: 0.6.51

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # `calloc`, and nothing else. Dart typed data is not pinned, so a buffer
  # pdfium writes into has to be native memory that stays put.
  ffi: ^2.1.0
  meta: ^1.16.0
  # `Outcome`, so a refusal here reads like every other refusal in this
  # repository (CR-093). The dependency points THIS way on purpose: core
  # gains nothing native by being depended upon, and a second result type
  # would be the two-vocabularies failure the corpus keeps naming.
  rackpal_core:
    path: ../rackpal_core

dev_dependencies:
  crypto: ^3.0.7
  test: ^1.26.0
  very_good_analysis: 9.0.0

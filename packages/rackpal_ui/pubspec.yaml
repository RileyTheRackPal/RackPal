name: rackpal_ui
description: >
  FlutterDiagramCanvas, render objects, widgets, viewport and canvas input.
  No app shell (that lives in apps/rackpal).
publish_to: none
version: 0.6.24

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  path_drawing: ^1.0.1
  rackpal_core:
    path: ../rackpal_core
  rackpal_text:
    path: ../rackpal_text
  vector_math: ^2.2.0

dev_dependencies:
  # Only used in test/canvas/status_message_controller_test.dart, to
  # deterministically test StatusMessageController's Timer-based
  # auto-clear without a real sleep. Was already resolved transitively
  # (flutter_test -> ... -> fake_async); listed directly now that a test
  # imports it, per pub's "declare what you import" convention.
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.0
  # Only used in test/flutter_canvas_test.dart, to build a real
  # PdfDocument for PdfFontMeasurer.fromBytes (the same concrete
  # TextMeasurer the PDF backend uses, injected here per CR-081) -- lib/
  # code never imports package:pdf.
  pdf: ^3.13.0

name: rackpal_export
description: >
  PdfDiagramCanvas, sheet furniture, schedule tables and document assembly.
  The isolate entry point for PDF generation. Pure Dart (isolate-safe).
publish_to: none
version: 0.6.60

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # M6-I5 (`#356`): the PDF's `/ID` is a sha256 of the file's own contents,
  # so two exports of one project are one file (docs/08 §8.4). Dart-team,
  # pure Dart, BSD-3, and already `rackpal_core`'s declared dependency, so
  # this declares what this package imports rather than adding one
  # (`depend_on_referenced_packages`, the app's `crypto` note).
  crypto: ^3.0.7
  # Transitive via `pdf` and now imported directly, pinned on the same
  # rule as `vector_math` below. `plan_image.dart` decodes an underlay to
  # screen it, which `pdf` cannot do for us: PdfImage.file returns an
  # image built from the SOURCE pixels, and DR-037 section 11.36.3 puts
  # the lightening pass in this backend. MIT, and already inside DR-036's
  # licence census because it was already in the resolved tree.
  image: ^4.9.1
  pdf: ^3.13.0
  rackpal_core:
    path: ../rackpal_core
  rackpal_text:
    path: ../rackpal_text
  # Transitive via `pdf` (PdfGraphics.setTransform takes a Matrix4 and
  # PdfDiagramCanvas needs Matrix4 directly for its transform stack) --
  # pinned explicitly per the architecture doc's guidance to pin
  # transitive dependencies that are imported directly.
  vector_math: ^2.2.0

dev_dependencies:
  test: ^1.26.0

name: rackpal_core
description: >
  RackPal's pure-Dart domain core: units, entities, commands/undo, persistence
  and the shared drawing IR. No Flutter, no dart:ui, no package:pdf (D1, CR-083).
publish_to: none
version: 0.5.28

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.7
  meta: ^1.16.0
  uuid: ^4.6.0
  vector_math: ^2.2.0

dev_dependencies:
  test: ^1.26.0
  very_good_analysis: 9.0.0

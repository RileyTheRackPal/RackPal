name: rackmate_ui
description: >
  FlutterDiagramCanvas, render objects, widgets, viewport and canvas input.
  No app shell (that lives in apps/rackmate).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  rackmate_core:
    path: ../rackmate_core
  rackmate_text:
    path: ../rackmate_text
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.0

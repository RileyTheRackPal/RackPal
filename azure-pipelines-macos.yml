# ======================================================================
# RackPal CI (macOS): Azure DevOps, Microsoft-hosted. DR-009, D4 (#459).
# ======================================================================
#
# WHY A SECOND DEFINITION AND NOT A SECOND JOB IN azure-pipelines.yml.
# The Windows job is the blocking build-validation policy on `main` and
# runs on the self-hosted agent, which costs no hosted minutes. This job
# needs a Microsoft-hosted macOS image, and the organisation has ONE free
# hosted parallel job with 1,800 minutes a month. A job inside the Windows
# definition would make the blocking policy's verdict depend on that
# allowance: the month the minutes run out, nothing merges. A separate
# definition lets this run as an OPTIONAL (non-blocking) PR check, which
# is the cadence the integrator chose on 2026-10-17 over nightly, weekly
# and manual-only, on last month's 22 PR builds (about 480 minutes).
#
# IT MUST STAY NON-BLOCKING for the same reason. Every re-push of a PR
# re-runs it, so the bill follows push habits, not merge counts.
#
# THE FLUTTER PIN IS NOT RESTATED HERE. It lives in azure-pipelines.yml
# and nowhere else (docs/11 section 7, DR-248), and run_local.ps1 reads it
# from there. The first step below reads it the same way, with the same
# two patterns, so moving the pin moves both platforms or fails this one
# by name. Do not add a `flutterVersion:` line to this file.
#
# WHAT IS PER-PLATFORM AND WHAT IS NOT (D4/2, #460). Every gate the
# Windows job runs is here EXCEPT:
#   * the timed budgets (rackpal_core_timed): wall-clock assertions of one
#     frame (16.7 ms) calibrated on the author's machine. A shared hosted
#     VM measures the VM, not the tree, and a red there teaches people to
#     ignore this pipeline. The budgets stay gated on Windows.
# The build IS here: `flutter build macos --release` and its output gate
# arrive with D1 (the `macos/` runner, #453/#454) and D6
# (tools/ci/verify_macos_build.ps1, #463), which the header used to say this
# file was waiting for. Only the timed budgets still stay on Windows.
# The analyzer, the formatter and the Python document gates cannot differ
# by platform in what they check, but they cost seconds and they ARE the
# D5 question ("do the gate scripts run under pwsh on macOS?"), so they
# stay until a run has answered it.
#
# WHAT IS NOT VERIFIED. As of the commit that adds this file, nothing in
# it has run. Its first runs are the D5/1 (#461) verification, and the
# floors in tools/ci/run_suite.ps1 are Windows counts until a macOS run
# measures its own. Expect the first run to be red, and read WHERE. The
# build steps at the end are the least measured of all: the Frameworks set
# verify_macos_build.ps1 expects is only the three entries that cannot be
# absent, and its first run is what records the real list.
# ======================================================================

trigger: none

# Ignored by Azure Repos, as in azure-pipelines.yml: PR runs come from a
# build-validation policy, not from this block. Kept so the intent reads
# from the file.
pr:
  branches:
    include:
      - main

variables:
  ciOutDir: '$(Build.SourcesDirectory)/build/ci'
  PUB_CACHE: '$(Pipeline.Workspace)/.pub-cache'

jobs:
  - job: macos_ci
    displayName: 'Analyze, test (macOS)'
    timeoutInMinutes: 90
    pool:
      vmImage: 'macOS-15'
    steps:
      - checkout: self
        displayName: 'Checkout (clean clone)'
        clean: true
        fetchDepth: 1
        fetchTags: false
        persistCredentials: false

      # The pin, read from the one place it lives. Same patterns as
      # tools/ci/run_local.ps1. A parse that finds nothing fails here by
      # name rather than installing an SDK called ''.
      - pwsh: |
          $pipeline = Get-Content -Raw 'azure-pipelines.yml'
          $v = [regex]::Match($pipeline, "(?m)^\s*flutterVersion:\s*'([^']+)'").Groups[1].Value
          $r = [regex]::Match($pipeline, "(?m)^\s*flutterFrameworkRevision:\s*'([0-9a-f]{40})'").Groups[1].Value
          if (-not $v -or -not $r) {
            Write-Host "##vso[task.logissue type=error]could not read the Flutter pin from azure-pipelines.yml (got '$v' / '$r')"
            exit 1
          }
          Write-Host "  pin : $v @ $r"
          Write-Host "##vso[task.setvariable variable=flutterVersion]$v"
          Write-Host "##vso[task.setvariable variable=flutterFrameworkRevision]$r"
        displayName: 'Read the Flutter pin from azure-pipelines.yml'

      # Every gate and run_suite.ps1 call `python`. Hosted macOS images are
      # not promised to carry that name, only `python3`; this puts both on
      # PATH for every later step, so no script needs a macOS branch.
      - task: UsePythonVersion@0
        displayName: 'Python 3 as `python`'
        inputs:
          versionSpec: '3.x'

      - pwsh: |
          Write-Host '== checkout forensics =='
          Write-Host "core.autocrlf : $(git config --get core.autocrlf)"
          Write-Host "core.eol      : $(git config --get core.eol)"
          Write-Host "commit        : $(git rev-parse HEAD)"
          Write-Host "os            : $(sw_vers -productVersion) $(uname -m)"
          Write-Host "python        : $(python --version 2>&1)"
          Write-Host "pwsh          : $($PSVersionTable.PSVersion)"
          Write-Host ''
          Write-Host '-- how git resolved the byte-exact goldens --'
          git check-attr text eol -- apps/rackpal/assets/starters/apartment.rppj
          git check-attr text eol -- packages/rackpal_core/test/fixtures/a_empty_project.rmpj.json
          New-Item -ItemType Directory -Path '$(ciOutDir)' -Force | Out-Null
        displayName: 'Checkout forensics'
        continueOnError: true

      - task: Cache@2
        displayName: 'Restore Flutter SDK cache'
        inputs:
          key: 'flutter | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "$(flutterVersion)"'
          path: '$(Agent.ToolsDirectory)/flutter'
        continueOnError: true

      - pwsh: |
          pwsh -NoProfile -File tools/ci/ensure_flutter.ps1 -Version '$(flutterVersion)' -ExpectedFrameworkRevision '$(flutterFrameworkRevision)' -InstallRoot '$(Agent.ToolsDirectory)'
          exit $LASTEXITCODE
        displayName: 'Install and VERIFY Flutter $(flutterVersion)'

      - task: Cache@2
        displayName: 'Restore pub cache'
        inputs:
          key: 'pub | "$(Agent.OS)" | "$(flutterVersion)" | pubspec.lock'
          path: '$(PUB_CACHE)'
        continueOnError: true

      - pwsh: |
          flutter pub get --enforce-lockfile
          exit $LASTEXITCODE
        displayName: 'flutter pub get (workspace root)'

      - pwsh: |
          pwsh -NoProfile -File tools/ci/analyze_gate.ps1
          exit $LASTEXITCODE
        displayName: 'Gate: analyzer (0 errors, 0 warnings, ratcheted infos)'
        condition: succeededOrFailed()

      - pwsh: |
          dart format --output=none --set-exit-if-changed .
          exit $LASTEXITCODE
        displayName: 'Gate: dart format'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/pal1_check.py
          exit $LASTEXITCODE
        displayName: 'Gate: PAL-1 palette conformance'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/palette_parity.py
          exit $LASTEXITCODE
        displayName: 'Gate: palette docs/registry parity'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/registry_parity.py
          exit $LASTEXITCODE
        displayName: 'Gate: palette code/registry parity'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/milestone_gate.py
          exit $LASTEXITCODE
        displayName: 'Gate: milestone completeness (section 8.9)'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/rule_review.py --check
          exit $LASTEXITCODE
        displayName: 'Gate: rule review pack grouping (#972)'
        condition: succeededOrFailed()

      # DR-090 section 11.89.8. Reads the bundled fonts' cmaps, which are
      # committed bytes, so nothing here differs by platform. fontTools is the
      # one Python dependency outside the standard library; see
      # tools/ci/requirements.txt for the pin and why it is hash-checked.
      - pwsh: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/ci/requirements.txt
          exit $LASTEXITCODE
        displayName: 'Python gate dependencies (fontTools, hash-pinned)'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/glyph_coverage_check.py
          exit $LASTEXITCODE
        displayName: 'Gate: glyph coverage (DR-090)'
        condition: succeededOrFailed()

      - pwsh: |
          python tools/ci/junit_converter_selftest.py
          exit $LASTEXITCODE
        displayName: 'Gate: JUnit converter self-test'
        condition: succeededOrFailed()

      # AC-051, #302: a named step so a rule added without its pair reads as
      # its own red line. The same file also runs inside the core suite.
      - pwsh: |
          dart test test/validation/drc_corpus_test.dart
          exit $LASTEXITCODE
        displayName: 'Gate: AC-051 pair coverage'
        workingDirectory: packages/rackpal_core
        condition: succeededOrFailed()

      # DR-258 (#1287): the identity gate, unshallowing commits only first.
      # Why each line is as it is: the same step in azure-pipelines.yml.
      - pwsh: |
          git -c "http.extraheader=AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN" fetch --quiet --no-tags --unshallow --filter=tree:0 origin "$env:BUILD_SOURCEVERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/identity_gate.py --ci
          exit $LASTEXITCODE
        displayName: 'Gate: identity and UTC offset (DR-258)'
        condition: succeededOrFailed()
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_core -Runner dart -Name rackpal_core -Tests untimed -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_core (pure Dart, untimed)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_text -Runner dart -Name rackpal_text -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_text (pure Dart)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_export -Runner dart -Name rackpal_export -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_export (pure Dart)'
        condition: succeededOrFailed()

      # The vendored universal dylib (#468) loads here as its x86_64 slice:
      # this image is Intel, so the arm64 half is checked for presence by
      # pdfium_vendoring_test.dart and run only on an Apple Silicon Mac.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_pdfium -Runner dart -Name rackpal_pdfium -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_pdfium (pure Dart, vendored native)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package packages/rackpal_ui -Runner flutter -Name rackpal_ui -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: rackpal_ui (Flutter)'
        condition: succeededOrFailed()

      - pwsh: |
          pwsh -NoProfile -File tools/ci/run_suite.ps1 -Package apps/rackpal -Runner flutter -Name rackpal_app -OutDir '$(ciOutDir)'
          exit $LASTEXITCODE
        displayName: 'Test: apps/rackpal (Flutter)'
        condition: succeededOrFailed()

      - task: PublishTestResults@2
        displayName: 'Publish test results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/*.junit.xml'
          searchFolder: '$(ciOutDir)'
          mergeTestResults: true
          testRunTitle: 'RackPal macOS, Flutter $(flutterVersion)'
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

      - task: PublishPipelineArtifact@1
        displayName: 'Publish raw test streams (forensics)'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(ciOutDir)'
          artifact: 'test-streams-macos'
          publishLocation: 'pipeline'

      # ==================================================================
      # THE macOS RELEASE BUILD (D1 #453/#454, D6 #463)
      # ==================================================================
      # Runs even when a suite failed, for the reason the Windows file gives:
      # whether the application still builds is independent information.
      # The hosted image is Intel (DR-255), so this builds and runs the
      # x86_64 slice only; the arm64 slice of pdfium is checked for presence
      # by the gate below and executed by no CI.
      - pwsh: |
          flutter build macos --release
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            # Consumed by the three steps below. WITHOUT IT they would run
            # against a bundle that does not exist and file a second,
            # misleading failure on top of the real one.
            Write-Host '##vso[task.setvariable variable=macosBuildProduced]true'
          }
          exit $code
        displayName: 'Build macOS release'
        workingDirectory: 'apps/rackpal'
        condition: succeededOrFailed()

      # Asserts things about what the build ACTUALLY PRODUCED (D6): the
      # bundle layout, both pdfium slices, the signatures, no JNI library,
      # the four starters. See the script's header.
      - pwsh: |
          pwsh -NoProfile -File tools/ci/verify_macos_build.ps1
          exit $LASTEXITCODE
        displayName: 'Gate: macOS release output'
        condition: and(succeededOrFailed(), eq(variables['macosBuildProduced'], 'true'))

      # `ditto`, NOT ArchiveFiles@2. A framework is built of symlinks
      # (Versions/Current and the top-level links into it), and a zip that
      # flattens them or drops the executable bit breaks the bundle's code
      # signature, which macOS reports to whoever downloads it as "damaged".
      # `ditto -c -k --keepParent` is Apple's own way to zip an .app and keeps
      # symlinks, modes and signatures. AND THE ARCHIVE IS ROUND-TRIPPED: it is
      # extracted into an empty directory and the extracted app must pass the
      # same `codesign --verify --strict` the build did, so "the download is
      # intact" is checked rather than assumed. It is still an ad-hoc,
      # un-notarised build for inspection; D8 makes a shippable one.
      - pwsh: |
          $app = '$(Build.SourcesDirectory)/apps/rackpal/build/macos/Build/Products/Release/RackPal.app'
          $zip = '$(Build.ArtifactStagingDirectory)/rackpal-macos-$(Build.BuildNumber).zip'
          & /usr/bin/ditto -c -k --keepParent $app $zip
          if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]ditto could not archive $app"; exit 1 }
          $check = Join-Path ([System.IO.Path]::GetTempPath()) ('rackpal-zip-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $check | Out-Null
          & /usr/bin/ditto -x -k $zip $check
          if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]the archive does not extract"; exit 1 }
          & /usr/bin/codesign --verify --strict (Join-Path $check 'RackPal.app') 2>&1 | ForEach-Object { Write-Host "  $_" }
          if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]the app extracted from the archive does not verify: the zip broke the bundle"; exit 1 }
          Write-Host "  archived and round-tripped: $((Get-Item $zip).Length) bytes, extracted app verifies"
        displayName: 'Archive macOS release (ditto, round-tripped)'
        condition: and(succeededOrFailed(), eq(variables['macosBuildProduced'], 'true'))

      - task: PublishPipelineArtifact@1
        displayName: 'Publish macOS release artifact'
        condition: and(succeededOrFailed(), eq(variables['macosBuildProduced'], 'true'))
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/rackpal-macos-$(Build.BuildNumber).zip'
          artifact: 'rackpal-macos'
          publishLocation: 'pipeline'

name: rackmate
description: RackMate — A/V rack and wiring design for custom integration.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Used by lib/main.dart to build the shared PdfFontMeasurer (CR-081): the
  # metrics font needs a PdfDocument, which lives in the low-level pdf API.
  # rackmate_ui deliberately does NOT depend on pdf, so the app is the layer
  # that constructs the one concrete measurer and injects it into the UI.
  pdf: ^3.13.0
  rackmate_core:
    path: ../../packages/rackmate_core
  rackmate_export:
    path: ../../packages/rackmate_export
  rackmate_text:
    path: ../../packages/rackmate_text
  rackmate_ui:
    path: ../../packages/rackmate_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Bundled TWICE per docs/08-pdf-export.md §10.2 ("the two-declaration
  # trap") -- once here under `fonts:` so Flutter's text engine can shape
  # and paint it (FlutterDiagramCanvas.drawText), and once under `assets:`
  # below so it is also loadable as raw bytes via `rootBundle.load()` for
  # `PdfFontMeasurer`/`PdfTtfFont` on the PDF side. Declaring only one side
  # makes the other silently fall back to a different font and every
  # measured metric diverges -- the exact failure CR-081 exists to
  # prevent. Family name must match `_familyFor` in
  # rackmate_ui/src/draw/flutter_canvas.dart and the `FontRef('Jost')`
  # used by both packages' test fixtures, verbatim.
  #
  # FONT CHOICE: Jost, a geometric sans in the Futura tradition -- chosen
  # over CR-080's originally-specified IBM Plex Sans for a denser,
  # control-panel-like read (the same reasoning that put Futura on Boeing
  # cockpit placards). This supersedes CR-080's font pick; CR-080's other
  # rulings (bundle twice, SIL-OFL-only, no built-in fallback) still hold.
  #
  # SCOPE NOTE: only Regular is bundled at this stage -- other weights and
  # Noto Sans Symbols (docs/08-pdf-export.md §10.1's full font table) are a
  # later stage's job.
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
  assets:
    - assets/fonts/Jost-Regular.ttf

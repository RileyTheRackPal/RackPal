name: rackmate
description: RackMate — A/V rack and wiring design for custom integration.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # NO FILE-DIALOG PACKAGE. RackMate drives `IFileDialog` itself, from
  # `windows/runner/file_dialog_channel.cpp`, reached only through
  # `lib/src/session/file_picker.dart`'s two-method wrapper — so every
  # open/save/Save-As flow is still widget-testable with no native dialog
  # and a grep test still asserts the single call site.
  #
  # `file_selector` WAS here and was removed on purpose. Its Windows
  # implementation calls `AddOptions` only for select-folders and
  # allow-multiple, and its Pigeon message has no field for anything else,
  # so `FOS_DONTADDTORECENT` could not be requested from Dart at any
  # price. Without that flag every open and every save writes the
  # project's name and full path into HKCU\...\ComDlg32\OpenSavePidlMRU.
  # With it, no file name reaches the host — though the shell writes
  # values under ComDlg32 that RackMate does not control, at minimum
  # LastVisitedPidlMRU (this executable plus the last folder browsed) and
  # CIDSizeMRU (this executable, written even on a cancelled dialog).
  # Measured examples, not an inventory
  # (lib/src/session/file_picker.dart carries the measurement and says why
  # this is stated as a bound).
  # Removing the package also removed
  # `file_selector_android`, one of the two packages that were pulling an
  # Android JNI library into a Windows Release build.
  #
  # DO NOT ADD IT BACK: `session_layering_test.dart` RULE 14d fails the
  # build if it returns, and docs/03-architecture.md §10.1 documents the
  # trade in its dependency table.
  flutter:
    sdk: flutter
  # `@immutable` on the storage layer's value objects, so overriding
  # `==`/`hashCode` on them is the analyzer-approved spelling rather than
  # a suppressed lint. Zero runtime cost; already core's dependency.
  meta: ^1.16.0
  # `path` and the path-provider are APP-layer per docs/03-architecture.md
  # §10.1's dependency table: rackmate_core does bytes <-> document and
  # never touches a path, a directory or a file, which is also what keeps
  # the data model cloud-ready.
  #
  # `path` — cross-platform joining. Never string-concatenate paths on
  # Windows. Injected as a `p.Context` everywhere in lib/src/storage/ so a
  # `p.Style.windows` unit test runs green on a Linux CI runner.
  path: ^1.9.0
  # `path_provider_windows` — getApplicationSupportPath() for recovery,
  # snapshots, recents and prefs. Called from EXACTLY ONE function
  # (`productionApplicationSupportDirectory`, lib/src/storage/
  # data_root.dart), enforced by a grep test: that single call site is the
  # whole mechanism that keeps M2's portable build a one-function change
  # rather than a five-store retrofit.
  #
  # THE PLATFORM PACKAGE DIRECTLY, NOT THE `path_provider` UMBRELLA. On
  # Windows the umbrella forwards to exactly this class, so the resolved
  # path is identical — what it ALSO did was pull `path_provider_android`
  # into a Windows-only build, and that package brings the `jni` FFI
  # plugin, which put `dartjni.dll` in the Release output beside
  # `rackmate.exe`. This app has no `android/`, `ios/`, `macos/` or
  # `linux/` directory; shipping an Android JNI bridge in its portable ZIP
  # was pure dead weight and one more unsigned binary for an enterprise
  # allowlist to block. `flutter_dependency_test.dart` asserts it is gone.
  # It is a DART-ONLY package (no native plugin, no extra DLL).
  path_provider_windows: ^2.3.0
  # Used by lib/main.dart to build the shared PdfFontMeasurer (CR-081): the
  # metrics font needs a PdfDocument, which lives in the low-level pdf API.
  # rackmate_ui deliberately does NOT depend on pdf, so the app is the layer
  # that constructs the one concrete measurer and injects it into the UI.
  pdf: ^3.13.0
  rackmate_core:
    path: ../../packages/rackmate_core
  rackmate_export:
    path: ../../packages/rackmate_export
  rackmate_text:
    path: ../../packages/rackmate_text
  rackmate_ui:
    path: ../../packages/rackmate_ui
  # NOT A FIFTH CHOICE — `window_manager`'s OWN transitive dependency,
  # named here only because the analyzer requires a direct declaration for
  # a direct import (`depend_on_referenced_packages`). It is already
  # compiled into the Windows runner as `screen_retriever_windows`
  # (generated_plugins.cmake), so declaring it adds no native plugin and
  # no binary weight.
  #
  # WHY IT IS IMPORTED AT ALL. §10.1's `window_manager` row lists
  # "size/position restore" as the reason that dependency exists, and
  # `validateRestoredBounds` needs the list of display work areas to
  # answer the question that matters: is this saved rectangle still on a
  # monitor that is plugged in? Without the display list the honest answer
  # is always "cannot tell", the app must centre every launch, and
  # position restore does not exist.
  screen_retriever: ^0.2.0
  # Window title with the dirty marker, size/position/maximised restore,
  # the minimum window size, and CRITICALLY `setPreventClose` — without
  # which the three-button close prompt (§9.5) cannot exist at all,
  # because the OS closes the window before we are asked. Reached only
  # through `lib/src/session/window_chrome.dart`, behind a small app-owned
  # interface with a fake, so the close/blur/geometry flows are
  # widget-testable with no real window.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Bundled TWICE per docs/08-pdf-export.md §10.2 ("the two-declaration
  # trap") -- once here under `fonts:` so Flutter's text engine can shape
  # and paint it (FlutterDiagramCanvas.drawText), and once under `assets:`
  # below so it is also loadable as raw bytes via `rootBundle.load()` for
  # `PdfFontMeasurer`/`PdfTtfFont` on the PDF side. Declaring only one side
  # makes the other silently fall back to a different font and every
  # measured metric diverges -- the exact failure CR-081 exists to
  # prevent. Family name must match `_familyFor` in
  # rackmate_ui/src/draw/flutter_canvas.dart and the `FontRef('Jost')`
  # used by both packages' test fixtures, verbatim.
  #
  # FONT CHOICE: Jost, a geometric sans in the Futura tradition -- chosen
  # over CR-080's originally-specified IBM Plex Sans for a denser,
  # control-panel-like read (the same reasoning that put Futura on Boeing
  # cockpit placards). This supersedes CR-080's font pick; CR-080's other
  # rulings (bundle twice, SIL-OFL-only, no built-in fallback) still hold.
  #
  # SCOPE NOTE: only Regular is bundled at this stage -- other weights and
  # Noto Sans Symbols (docs/08-pdf-export.md §10.1's full font table) are a
  # later stage's job.
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
  assets:
    - assets/fonts/Jost-Regular.ttf
    # The four starter projects (docs/04-rack-editor.md §9, AC-052).
    # REAL `.rackmate` FILES, checked in, regenerated by
    # `dart run tool/generate_starters.dart` and verified byte-for-byte
    # by `test/starters/starter_assets_test.dart`. They are goldens, perf
    # fixtures and screenshot source at once, and the roadmap's global
    # rule is that every milestone ends with the app opening all four.
    - assets/starters/
